<style>
  /* Slate & Amber — bold amber (track) + bright blue (room) */
  :root{--bg:#161a20;--card:#1f242c;--card2:#272d37;--line:#343b46;--ink:#f2f4f7;--muted:#98a2b0;
    --accent:#ffab00;--accent-ink:#1a1206;--room:#1e9bff;--room-ink:#04141f;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#161a20 82%,rgba(22,26,32,.9));padding:14px 16px 12px;border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
  h1{margin:0 0 10px;font-size:18px;letter-spacing:.2px}
  h1 small{color:var(--muted);font-weight:500;font-size:12px;display:block;margin-top:2px}
  .fgroup{margin-bottom:8px}
  .flabel{font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin:0 2px 5px}
  .frow{display:flex;flex-wrap:wrap;gap:7px}
  .divider{height:1px;background:var(--line);margin:10px 0 9px;border:0}
  .tk{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .12s;white-space:nowrap}
  .tk:hover:not(.active){border-color:var(--accent);color:var(--ink)}
  .tk.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 2px rgba(255,171,0,.25)}
  .tk.room:hover:not(.active){border-color:var(--room);color:var(--ink)}
  .tk.room.active{background:var(--room);border-color:var(--room);color:#fff;box-shadow:0 0 0 2px rgba(30,155,255,.28)}
  main{padding:8px 12px 40px;max-width:820px;margin:0 auto}
  .slot{margin:20px 4px 10px;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .cell{aspect-ratio:1/1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden;transition:all .12s;font-family:inherit}
  .cell:hover:not(.dim){background:var(--card2);border-color:var(--accent)}
  .cell .t{font-size:14px;line-height:1.28;font-weight:700;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .cell .b{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;margin-top:8px}
  .cell .rm{font-size:10.5px;font-weight:800;color:#fff;background:var(--room);padding:3px 7px;border-radius:999px;white-space:nowrap}
  .cell .sp{font-size:11px;color:var(--muted);line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cell.dim{opacity:.3;cursor:default;pointer-events:none}
  @media(max-width:420px){.cell .t{font-size:12.5px}.cell{padding:10px}}
  #overlay{position:fixed;inset:0;background:rgba(8,10,14,.72);z-index:50;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
  #overlay.show{display:flex}
  #modal{background:var(--card2);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:16px;max-width:600px;width:100%;max-height:88vh;overflow:auto;padding:20px}
  #modal h2{margin:0 0 4px;font-size:19px;line-height:1.3}
  .meta{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 4px;font-size:13px;color:var(--muted)}
  .meta b{color:var(--ink)}
  .chip{background:#161a20;border:1px solid var(--line);padding:4px 10px;border-radius:999px}
  .abx{margin-top:12px;font-size:15px;line-height:1.6;color:#e7ebf1;white-space:pre-wrap}
  #close{margin-top:18px;width:100%;padding:12px;border-radius:11px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:700;cursor:pointer}
  #close:hover{filter:brightness(1.06)}
  footer{color:var(--muted);text-align:center;font-size:11px;padding:16px}
</style>

<script>
const SESSIONS = [{"slot": "Welcome", "time": "8:15 AM ET", "room": "All", "title": "Opening Remarks", "speaker": "Phil Japikse", "track": "Other", "level": "General", "abstract": "Welcome to another Cincy Deliver!"}, {"slot": "1", "time": "8:45 AM ET", "room": "Magnolia", "title": "Becoming an Integral Influencer: Leading Change Without the Title", "speaker": "Faye Thompson", "track": "Scaling/Transformational Agile", "level": "Intermediate", "abstract": "In today’s organizations, influence often matters more than authority. Delivery team members often hold the insights that can transform outcomes, yet struggle to gain traction with stakeholders. This session introduces the Integral Model as a powerful lens for influence—helping you see the whole system, speak to every perspective, and design strategies that inspire alignment and action. Walk away with practical tools and a new mindset for becoming an “integral influencer” in your own organization.\r\n\r\nLearning Objectives:\r\n1. Analyze stakeholder dynamics using the Integral Model’s four quadrants to identify gaps in influence strategies.\r\n2. Apply the quadrant framework to real-world scenarios to design more holistic approaches to stakeholder engagement.\r\n3. Evaluate the effectiveness of past or current influence attempts by diagnosing which quadrants were emphasized or neglected.\r\n\r\n\r\nOutline\r\n1. Opening & Context\r\n? Why influence matters more than authority for BAs/PdMs\r\n? Quick reflection: when have you struggled to get buy-in?\r\n2. The Problem of One-Dimensional Influence\r\n? Over-reliance on data or culture alone\r\n? Need for a whole-system perspective\r\n3. Introducing the Integral Model\r\n? Four quadrants overview (UL, UR, LL, LR)\r\n? Visual diagram to anchor the concept\r\n4. Quadrant Deep Dive\r\n? Upper Left: Mindsets, values, motivations\r\n? Upper Right: Behaviors, data, measurable outcomes\r\n? Lower Left: Culture, shared meaning, team dynamics\r\n? Lower Right: Systems, processes, structures\r\n? Real-life examples will be highlighted for each quadrant\r\n5. Interactive Exercise: Map Your Influence Challenge\r\n? Participants identify a current influence challenge\r\n? Use quadrant handout to map stakeholders, values, data, culture, and systems\r\n? Pair share: Which quadrant have you been neglecting?\r\n? Group debrief: 2–3 volunteers share insights\r\n? Key message: Influence grows when you see the whole system\r\n6. Practical Tools\r\n? Stakeholder mapping by quadrant\r\n? Influence checklist: Have I addressed all four?\r\n? Language flexing: data-driven, values-driven, storytelling, process-fit\r\n7. Case Study Walkthrough\r\n? Example of failed influence attempt\r\n? Show how it neglected quadrants\r\n? Reframe through all four for success\r\n8. Key Takeaways\r\n? Influence is multi-dimensional\r\n? The Integral Model is both diagnostic and design tool\r\n? Ask: Which quadrant am I neglecting?\r\n9. Closing & Call to Action\r\n? Apply the model in your next stakeholder interaction\r\n? Reflect afterward on which quadrants you emphasized or missed\r\n\r\n* It would be great to have space to facilitate this session with people up and moving around the room.  If that is not possible, I can facilitate from where they are sitting."}, {"slot": "1", "time": "8:45 AM ET", "room": "Augusta", "title": "Minimalism a foundational principle of Agile", "speaker": "Mark Haynes", "track": "Agile Methodologies", "level": "Intermediate", "abstract": "Agile’s strength lies in its adaptability and efficiency, yet a crucial principle often gets overshadowed – minimalism. Minimalism permeates every aspect of the Agile procurement and delivery process. Embracing minimalism streamlines processes and fundamentally enhances value by prioritizing meaningful outcomes over irrelevant tasks.\r\n\r\nIs it enough to repeat the “Agile Manifesto”, mantra and follow the Scrum playbook of ceremonies? Let’s examine this core principle, especially how it applies to software development.  We will:\r\n\r\n    • Define minimalism from several different disciplines,\r\n    • Identifying a few red flags to assess if you’re going off the rails,\r\n    • Discuss a few candidates for Agile minimalism and\r\n    • Establishing policy checkpoints to help guide your team."}, {"slot": "1", "time": "8:45 AM ET", "room": "Marquis", "title": "Agents Are Products, Not Prompts: Engineering Principles for Effective AI Agents", "speaker": "Shawn Wallace", "track": "AI", "level": "Introduction", "abstract": "When AI agents fail, it's rarely the model's fault — it's because they weren't designed, they were just prompted into existence. Teams treat agent creation as prompt engineering when it should be software engineering. The result? Agents that work inconsistently, can't be maintained, and break when requirements change.\r\n\r\nI'll present a framework for designing agents as engineered products with clear architecture, testable behavior, and maintainable structure. You'll see a production agent decomposed component by component, walk through real agents that fill roles across the software development lifecycle, and leave with a repeatable process you can apply immediately."}, {"slot": "1", "time": "8:45 AM ET", "room": "Sterling", "title": "Flow Before and After the Machines: Using Kanban to Navigate an Agentic AI Transformation", "speaker": "Liz Rettig", "track": "Agile Experiences", "level": "Intermediate", "abstract": "Two weeks into a Kanban transformation, a new CTO arrived with an agentic AI engineering framework and changed everything. The Kanban implementation stalled, the team shifted focus to learning new tooling, and throughput dropped. But the flow data kept telling the truth. This session uses that real case study to explore how cycle time and throughput metrics exposed delivery problems before the AI transition, revealed the real cost of the learning curve after it, and ultimately made the case for why a Portfolio Kanban layer and a leadership shift in how work enters the system are non-negotiable regardless of your tooling. If agentic AI is in your organization's future, the data suggests the conversation will soon move from delivery in days to delivery in hours. Getting there requires more than better tools."}, {"slot": "1", "time": "8:45 AM ET", "room": "Savannah", "title": "Optimizing the Wrong Thing", "speaker": "Brad Nelson", "track": "DevOps", "level": "General", "abstract": "Every organization claims to be data-driven. Almost none of them are — and the ones that get closest often make worse decisions because of it.\r\n\r\n“Data-driven” suggests the data decides. But data doesn’t decide. People do. When teams treat metrics as truth rather than evidence, they optimize proxies, game dashboards, and mistake confidence for competence.\r\n\r\nAgile, Lean, DevOps, and Design Thinking all share the same root: disciplined experimentation. Yet many organizations adopt the vocabulary without adopting the epistemology. They measure what’s easy instead of what matters, confuse correlation with causation, and A/B test their way into local maxima.\r\n\r\nThis session reframes what it actually means to think scientifically at work. We’ll examine how metrics drift from outcomes, why velocity gaming is predictable, and how teams can use data as a tool for learning rather than a substitute for judgment.\r\n\r\nIf you’ve ever watched a dashboard improve while performance stagnated, you already know the problem. This talk names the system behind it."}, {"slot": "1", "time": "8:45 AM ET", "room": "Charleston", "title": "Data Doesn't Have to be the Blocker", "speaker": "Brian Sherwin", "track": "AI", "level": "General", "abstract": "You're starting work on a new project, but you don't have access to the data. You want to develop a new feature, but you don't have the data. You want to demo a maintenance scenario, but all you have is flight data. It seems that every project is based on data, and often, it's the data the blocks us from making rapid progress. In this talk, I'll show you how our team has moved from using AI to just write code and started creating data that isn't just random nonsense, but believable data specific to the industries we are coding for."}, {"slot": "2", "time": "10:00 AM ET", "room": "Magnolia", "title": "From Resistance to Ownership: Motivational Interviewing in Agile Teams", "speaker": "Thom Brackett", "track": "Other", "level": "General", "abstract": "Agile leaders are told to coach, empower, and inspire ownership. But when resistance shows up — to change, accountability, or new ways of working — most of us default to pushing harder.\r\n\r\nMotivational Interviewing (MI) offers a different approach.\r\n\r\nOriginally developed in behavioral psychology to help people change resistant behaviors, MI provides a practical conversational framework for guiding change without force. It shifts the leader’s role from persuader to evoker — helping individuals surface their own motivations instead of defending against yours.\r\n\r\nIn this interactive 60-minute session, Thom Brackett introduces the core principles of Motivational Interviewing and demonstrates how they translate directly into Agile environments. Participants will explore how to:\r\n\r\nRespond to resistance without escalating authority\r\n\r\nAsk questions that increase ownership and intrinsic motivation\r\n\r\nReduce defensiveness in difficult conversations\r\n\r\nMove teams from compliance to commitment\r\n\r\nThis is not a lecture on listening skills. Attendees will practice reframing common Agile leadership conversations using MI techniques they can immediately apply in 1:1s, retrospectives, and stakeholder discussions.\r\n\r\nIf you’ve ever felt stuck pushing change that others weren’t ready to own, this session will offer a practical and human alternative."}, {"slot": "2", "time": "10:00 AM ET", "room": "Augusta", "title": "Making Your APIs AI-Ready", "speaker": "Mike Amundsen", "track": "Web Development", "level": "Intermediate", "abstract": "This talk outlines five critical shifts organizations can make to ensure their API ecosystems are machine-ready: Intentionality, Context, Standardization, Discovery, and Adaptability. Drawing inspiration from pioneers like Donald Norman, Douglas Engelbart, Roy Fielding, Ted Nelson and Christopher Alexander, this session offers a strategic and actionable framework to help API teams prepare for the inevitable; machine-driven APIs."}, {"slot": "2", "time": "10:00 AM ET", "room": "Marquis", "title": "The Evolution to an Agile Team", "speaker": "Jeff Pyle", "track": "Agile Experiences", "level": "Introduction", "abstract": "For the last 10 years, as we have added members to our team (and lost some during COVID), we have tried to keep our team \"working the business\" while at the same time trying to get more done and faster.  This talk will dive into the various things we have tried over the years to evolve our team from a one-person band to a 6-person team now using Azure DevOps to increase software delivery time and trying to satisfy as many internal stakeholders as possible."}, {"slot": "2", "time": "10:00 AM ET", "room": "Sterling", "title": "Compound Velocity: Building Just-In-Time Developer Tooling with AI Orchestration", "speaker": "Jim Myers", "track": "AI", "level": "Intermediate", "abstract": "Every developer has a graveyard of half-finished scripts and tools they always meant to build but never had time to polish. This session tells the story of how AI orchestration finally closed that gap.\r\n\r\nBy coordinating specialized agents; Gemini CLI, Claude Code, and Codex behind a lightweight micro-kernel CLI, this architecture becomes a factory for tools rather than a one-off script generator. We will break down the three pillars that make it work: dynamically routing tasks across models based on their strengths; correlating shell history with versioned events to build an AI-driven retrospective that captures not just what changed but why; and running multi-dimensional review pipelines that validate AI-generated code before it ships.\r\n\r\nEverything, the orchestration kernel, the review workflows, and the tools themselves are open source. You will leave with a practical blueprint and working code for finally building and shipping the tool you have always meant to build."}, {"slot": "2", "time": "10:00 AM ET", "room": "Savannah", "title": "10 ways to be a better (technical) interviewer", "speaker": "Mike Eaton", "track": "Other", "level": "General", "abstract": "Whether you work for a large company or a small one, there's a good chance you'll be asked to interview candidates — and almost no chance anyone trained you how to do it well. The result? Inconsistent interviews, unfair comparisons, and decisions driven more by gut feel than evidence. Worse, one careless question could expose your company to legal risk.\r\n\r\nThis session gives you thirteen concrete, immediately actionable techniques to fix that. You'll leave with a question bank structure, a scoring rubric template, a note-taking framework, and a list of questions you should never ask — and what to say instead. We'll also tackle remote interviewing specifically, including how to set a clear, fair policy on AI use before the candidate ever joins the call. No fluff, no mindset advice — just practical tools you can use before your next interview."}, {"slot": "2", "time": "10:00 AM ET", "room": "Charleston", "title": "30ms of Cloudflare Wizardry", "speaker": "Bob Fornal", "track": "Cloud Computing", "level": "General", "abstract": "The smallest part of Cloudflare is the most powerful!\r\n\r\nLet's geek out on an insightful exploration of Cloudflare Worker Scripts, Key Vaults, and beyond based on over a year of deep hands-on experience. This session will unveil how a single line of code can either break production or unlock powerful functionalities.\r\n\r\nPrepare for a deep dive into practical techniques, including:\r\n\r\n* Dynamically altering DOM elements\r\n* Utilizing URL paths and parameters to customize content and manage routing\r\n* Employing Key Vaults for more than just enhanced security\r\n* Leveraging D1 Databases effectively\r\n* Managing cookies with precision\r\n\r\nThis talk features a captivating live demo, allowing participants to witness real-time code execution and solutions. Let's hope the WiFi gods smile upon us for an engaging and seamless experience!"}, {"slot": "3", "time": "11:15 AM ET", "room": "Magnolia", "title": "AI Your Way: MCPs vs Skills vs SubAgents 🤖🚀", "speaker": "Sam Basu", "track": "AI", "level": "Intermediate", "abstract": "It is the age of AI – a big opportunity to streamline and automate developer workflows for better productivity. There are some challenges though – AI Models often lack knowledge and AI Agents need expertise/guidance to reliably pull off complex workflows. Context is everything for modern AI and you can bring it.\r\n\r\nModel Context Protocol (MCP) aims to provide a standardized way to connect AI Agents to different data sources, tools and non-public information - the point is to provide deeply contextual information/expertise to AI. Skills are higher-level behaviors and instructional guardrails, that define how and when AI Agents should leverage tools to accomplish something meaningful. Subagents in AI are specialized, task-focused agents designed to handle specific, well-defined tasks within a larger AI system. \r\n\r\nIn terms of the food industry:\r\nAI Agent = Chef ??????????\r\nMCP Tools = Raw Ingredients ?? ??\r\nSkills = Recipe Cards ?? ??\r\nSubAgents = Sous Chef ?? ??\r\nLoops = Door Watcher ????\r\nDeveloper = Restaurant Owner ??.\r\n\r\nSo, what should developers use to bring context and guardrails to make AI work their way? Well, it depends and sometimes, the answer might be whatever combination makes developers most productive. With official SDKs and well-thought-out guidance, it is a breeze to work with MCPs, Skills or SubAgents. Developers could bring their own data, APIs, services, coding patterns and structured guidance to make AI Agents work their way. With contextual expertise to light up unique coding workflows, AI Agents can make developers ultra productive – upwards and onwards."}, {"slot": "3", "time": "11:15 AM ET", "room": "Augusta", "title": "Peekaboo Engineering: The secret game great software teams play", "speaker": "Jon Fazzaro", "track": "Agile Experiences", "level": "General", "abstract": "At first glance, our reality appears stable. But look closer, and you'll see its ceaseless ocillations: we inhale, then exhale; we blink, then look; we wake, then sleep. Waves of energy and matter crest and trough to make everything around us what it is. It's an endless “peek-a-boo” of states switching back and forth.\r\n\r\nThe work of creating software has these, too: red tests turn green, code compiles then runs, we work alone, then with a pair; we concentrate and thrash, only to realize the fix while taking a walk afterward.\r\n\r\nThis isn’t philosophical—it’s practical: we can reliably ship better software sooner by dancing with the way complex systems actually stabilize: through well-tuned, repeated alternation.\r\n\r\nIn this talk, we’ll look closer at engineering practices as oscillators, and we'll explore how we can use them on purpose. You’ll learn how to design feedback loops that want to converge (fast tests, tiny commits, tight review), how to tune collaboration cycles (solo/pair/mob) to match the work, and how to exploit recovery cycles (focus/break) for better decisions and cleaner code."}, {"slot": "3", "time": "11:15 AM ET", "room": "Marquis", "title": "AI Agent Workflows with Azure Functions (and Friends)", "speaker": "Michael Collier", "track": "AI", "level": "Intermediate", "abstract": "AI agents are moving beyond demos into real production systems, but reliability quickly becomes the hard part. Long-running work, retries, coordination between agents, and external dependencies demand more than simple prompt-driven flows.\r\n\r\nIn this session, you’ll learn how to build durable, production-ready agent workflows using familiar Microsoft tools. We’ll use Azure Functions as the serverless foundation, Durable Agents with the Microsoft Agent Framework to orchestrate multi-step AI behavior, and .NET Aspire to simplify service composition and improve the developer experience.\r\n\r\nWe’ll explore how multiple AI agents collaborate, recover from failures, and make decisions over time while remaining scalable, deterministic, and maintainable. We’ll also discuss key trade-offs and when agent-based workflows make sense (and when they don’t)."}, {"slot": "3", "time": "11:15 AM ET", "room": "Sterling", "title": "Refactor, Rebuild, or Regret It: Strategic App Modernization", "speaker": "Brian McKeiver", "track": "Agile Methodologies", "level": "General", "abstract": "Software products rarely stay clean. Over time, they evolve, accumulate technical debt, and turn into a fragile mix of outdated frameworks, layered workarounds, and tightly coupled dependencies.\r\n\r\nWhen you are responsible for a complex 15-year-old platform, modernization is not just about how to upgrade it. It is about deciding what truly deserves to change. Do you refactor incrementally or rebuild from the ground up? Do you prioritize long-term architectural health or the next urgent feature request? The answer is rarely obvious.\r\n\r\nThis session explores how blending product thinking with software modernization leads to smarter decisions. Through real-world lessons from a long-running SaaS platform, we will examine how to evaluate tradeoffs through the lens of product strategy, user impact, and business value. You will see how to balance technical constraints with customer expectations while continuing to deliver.\r\n\r\nWhether you are leading a legacy transformation or trying to prevent one, this talk provides a practical framework for making strategic modernization decisions without forcing the business to pause innovation."}, {"slot": "3", "time": "11:15 AM ET", "room": "Savannah", "title": "From Resistance to Results: How Leaders Unlock 5x More Change Success", "speaker": "Art Lashchonau", "track": "Other", "level": "General", "abstract": "Successful change isn’t just about having the right plan, it’s about having people who are committed to making it happen. Leaders play a pivotal role in driving engagement, and when teams are fully invested, they’re up to five times more likely to deliver lasting results.\r\nIn this session, you’ll discover practical, ready-to-use strategies leaders can apply to spark ownership, strengthen collaboration, and keep momentum high. Through real-life examples from organizations that boosted engagement and achieved faster adoption of shifting requests, you’ll see how small, intentional actions create a culture where people don’t just accept change, they drive it. You’ll leave with a toolkit of tactics you can put into practice immediately to accelerate change implementation and deliver stronger outcomes."}, {"slot": "3", "time": "11:15 AM ET", "room": "Charleston", "title": "From Vibe Coding to Production-Ready: Mastering Spec-Driven Development with GitHub Spec Kit", "speaker": "Kevin Grossnicklaus", "track": "AI", "level": "Intermediate", "abstract": "I have been writing code since 1985. I have watched this industry go through more transformation cycles than I can count — and what is happening right now with AI-assisted development is unlike anything I have seen before. The tools are genuinely impressive. The problem is that most teams are using them in a way that creates as many problems as it solves.\r\n\r\nIf you have spent any time with GitHub Copilot or Claude Code, you already know the pattern: you describe what you want, the AI generates something that looks reasonable, and then you spend the next several hours figuring out why it does not quite work, does not fit your architecture, or will be a maintenance nightmare six months from now. That is what the industry has started calling \"vibe coding\" — and it is costing teams real time and real money.\r\n\r\nIn this session, I will walk you through the methodology I have personally adopted to solve this problem: spec-driven development using GitHub's open-source Spec Kit toolkit. This is not a theoretical framework. It is the actual workflow I use daily, and it has fundamentally changed how I think about the role of AI in software development.\r\n\r\nThe core insight is straightforward: AI coding assistants perform best when you treat them like a highly capable junior developer. They need clear, detailed, unambiguous instructions. When you invest time upfront writing a proper specification — one that encodes your architectural principles, defines the expected behavior, and breaks the work into focused tasks — the AI stops being an unreliable generator and starts being a reliable implementation partner.\r\n\r\nI will demonstrate the complete workflow live: establishing the constitutional principles that encode your standards, writing executable specifications that serve as the source of truth, generating technical plans that respect your architectural constraints, and decomposing work into discrete tasks that AI agents can implement consistently. You will see a real application built from scratch in under 20 minutes — not a toy demo, but production-quality code with testing, security, and maintainability built in from the start.\r\n\r\nWe will also cover how specifications integrate naturally with Git workflows, how they become living documentation that survives team turnover, and what early adopters are seeing in terms of development velocity — in many cases, 3x to 10x improvements while actually improving architectural consistency, not sacrificing it.\r\n\r\nI have been sharing this journey publicly over the past several months, and the response from other developers and technical leaders has been consistent: the bottleneck in modern software development has moved. It is no longer about writing code. It is about writing detailed, precise specifications. Once you internalize that shift, everything about how you work with AI tools changes."}, {"slot": "Lunch", "time": "12:30 PM ET", "room": "Magnolia", "title": "AI Tools in the Trenches", "speaker": "Mike Morse", "track": "AI", "level": "General", "abstract": "A panel of consultants from Ingage Partners discusses AI Tools in the Trenches: What Actually Works, What Broke, and What It Cost: A conversational Q&A on real-world AI tool adoption in product and development teams: what works, what fails, and the practical tradeoffs."}, {"slot": "Lunch", "time": "12:30 PM ET", "room": "Augusta", "title": "Keys to Success in the AI Journey: Learning from Experience", "speaker": "Kyle Brown", "track": "AI", "level": "Introduction", "abstract": "Centric will share major pitfalls that we see organizations fall into in their AI Journey including the associated business and governance alignment that is often overlooked. We will share some of our own practices to mitigate these challenges as well as stories from Clients who have successfully navigated challenges to begin their AI Journeys."}, {"slot": "4", "time": "1:30 PM ET", "room": "Magnolia", "title": "Debugging Human Systems: Using the Tech Stack to Rethink Leadership", "speaker": "Maureen Carruthers", "track": "Other", "level": "General", "abstract": "You know how to debug complex systems. But when it comes to leading people, the rules suddenly feel murky.\r\n\r\nMiddle managers in tech are often promoted for technical excellence and then handed an invisible, emotionally complex system with no documentation. When collaboration breaks down or performance slips, the default advice is simple: try harder.\r\n\r\nBut heroic effort is a trap.\r\n\r\nThat’s where the “Leadership Stack” comes in. Inspired by the layers of a tech stack, this framework shifts the focus from individual performance to the systems underneath it. Instead of treating team challenges as personal failures, it highlights how issues often originate in deeper layers: interfaces, data flow, security responses, permissions, and the organizational operating system.\r\n\r\nThrough real-world stories from distributed technical teams, this session shows how viewing your team as a system helps leaders reduce friction, rebuild trust, and address persistent people challenges—without burning out.\r\n\r\nIf you’ve ever ended a day feeling like you did no “real work,” this talk will help you see the system you’re actually maintaining—and how to debug it with clarity and confidence."}, {"slot": "4", "time": "1:30 PM ET", "room": "Augusta", "title": "Your Sprint Was Designed for a World That No Longer Exists", "speaker": "Brian Adams", "track": "Agile Experiences", "level": "Intermediate", "abstract": "AI has fundamentally shifted where the bottleneck lives in software delivery. Our agile ceremonies were designed around the assumption that implementation is the expensive, risky phase. That assumption is rapidly becoming outdated, and teams that don't adapt will lose their best engineers to frustration and their competitive edge to teams that do. Drawing on Nicole Forsgren's research on developer experience, this talk examines which agile practices still earn their place, which need to evolve, and what high-performing teams are optimizing for in 2026. You'll leave with a practical framework for reshaping your team's rituals around what actually matters now: creativity, autonomy, and making better decisions faster."}, {"slot": "4", "time": "1:30 PM ET", "room": "Marquis", "title": "Claude Code for Everyone!", "speaker": "Rich Theil", "track": "AI", "level": "Intermediate", "abstract": "Join us for a hands-on deep dive into Claude Code — the AI-powered command line tool that's not just for engineers anymore:\r\n\r\n- Learn how to set up and navigate Claude Code with zero engineering background\r\n- Discover how to write better user stories, acceptance criteria, and product documentation in seconds\r\n- See how Scrum Masters, product managers, and product owners are using it to move faster every day\r\n- Watch Claude Code write, explain, and debug actual code — even if you've never written a line yourself\r\n\r\nWhether you're a knowledge worker looking to level up or an engineer who hasn't explored Claude Code yet, leave with a workflow you can use tomorrow."}, {"slot": "4", "time": "1:30 PM ET", "room": "Sterling", "title": "The Transformation We Never Finished: What Agile's Unlearned Lessons Are About to Cost Us", "speaker": "Matt Anderson", "track": "Other", "level": "Intermediate", "abstract": "Most agile transformations changed the rituals but not the wiring. We renamed meetings, adopted frameworks, and tracked velocity, but decisions still flow up, money still flows annually with rigid approvals, and the org chart still wins. Sound familiar?\r\n\r\nNow those same organizations are charging into AI adoption and running into eerily familiar friction. This talk connects the dots between the organizational patterns we didn't change during agile and the ones that are quietly capping AI's potential today.\r\n\r\nThrough three examples every practitioner will recognize — the meeting, the budget, and incident response — we'll walk through what \"surface-level transformation\" actually looks like in practice, and why it keeps repeating.  We'll also take a look at 3 horizons of AI maturity using Cynefin, Conway's Law, and Team Topologies to make sense of where organizations stall and why.\r\n\r\nYou'll walk away with a practical diagnostic, the \"AI Readiness Retro\", that borrows from agile's best practice to help your organization honestly assess its transformation ceiling, and discuss some real next steps to develop your understanding of how to identify and begin addressing the gaps.\r\n\r\nThis isn't really an AI talk. It's a conversation about the transformation work we left on the table and what it means now that the stakes are higher."}, {"slot": "4", "time": "1:30 PM ET", "room": "Savannah", "title": "Claude at STACK Construction Technologies", "speaker": "Ed Sumerfield", "track": "AI", "level": "Intermediate", "abstract": "What happens when you hand 40 developers an AI and get out of the way? At STACK, we did just that. This talk covers our honest experience rolling out Claude across an engineering org - what stuck, what failed, and what we'd do differently."}, {"slot": "4", "time": "1:30 PM ET", "room": "Charleston", "title": "Prompt to Product: Building a HubSpot Clone Live", "speaker": "David Merk", "track": "Other", "level": "Introduction", "abstract": "This presentation might get me blacklisted because I’m going to say the quiet part out loud: if anyone can vibe code anything, what’s the value of being a builder? As the cost of producing software drops, the value of judgment rises. David Merk makes the case for focusing on solutions over syntax and outcomes over output, then walks through a practical system for requirement engineering and the early AI agents that can help entrepreneurs turn ambition into execution. This is a talk about what still matters when everyone can build."}, {"slot": "5", "time": "2:45 PM ET", "room": "Magnolia", "title": "From Stories to Systems: AI and the Collapse of Agile Planning", "speaker": "Brad Gardner", "track": "AI", "level": "Intermediate", "abstract": "For two decades, user stories and story points were the fundamental units of software planning and delivery. Over the past eighteen months, we systematically dismantled that process across multiple client delivery teams and replaced it with something fundamentally different. This talk is a technical walkthrough of what we built. We'll cover how Specs replaced stories as the atomic unit of planning, and why epic-level definition gives AI the context it needs to generate meaningful output. We'll examine how client discovery flows through AI-assisted drafting into structured requirements with acceptance criteria and dependency maps before a single work item exists, how standardized scaffolding enforces architecture and infrastructure standards at project inception instead of through senior engineer oversight, and how delivery agents handle code generation, test generation, and documentation against those Specs. The SDLC isn't evolving. It's collapsing. Attendees will leave with a concrete picture of what an AI-native delivery process looks like after eighteen months of iteration, which layers of their current process are ready to be compressed, and which new technical disciplines need to take their place."}, {"slot": "5", "time": "2:45 PM ET", "room": "Augusta", "title": "Navigating the Maze of Communicating Architecture Decisions", "speaker": "Chad Green", "track": "Architecture", "level": "Introduction", "abstract": "Clarity in articulating design choices is the bedrock of successful software architecture. This session explores the transformative power of Architecture Decision Records (ADRs) as a tool to capture the nuanced “why” behind every architectural choice, from selecting a framework to defining a core pattern. Through compelling real-world examples, we break down the essentials of ADRs and demonstrate how to document context, rationale, and consequences effectively.\r\n\r\nYou will walk away with actionable guidelines for authoring, maintaining, and evolving ADRs throughout your project lifecycle, providing a blueprint for clear, confident communication. Whether you’re a seasoned architect refining complex decision processes or a developer venturing into architectural design, this talk will empower you to make your design rationale accessible and impactful."}, {"slot": "5", "time": "2:45 PM ET", "room": "Marquis", "title": "How AI Changed Our SDLC: The 3 New Problems We Had to Solve", "speaker": "Alex Will", "track": "AI", "level": "Intermediate", "abstract": "AI has changed how we deliver software, but for our team the biggest impact was not just speed. It was the new problems AI introduced into the development lifecycle.\r\n\r\nIn this session, I’ll share three of the biggest shifts we experienced after bringing AI into day-to-day delivery: estimation became less predictable, developers could generate code they did not fully understand, and code review became harder as output increased faster than human validation could scale.\r\nI'll walk through how we adapted our processes at every phase: estimation, code review, quality assurance, and developer accountability. Some of the changes were intuitive. Others were counterintuitive and only emerged after things broke. In each case, I'll share the specific practice we adopted, why it works, and what we tried first that didn't.\r\n\r\nThis is not a talk about AI hype or a catalog of tools. It is a practical look at how AI changes software delivery in the real world, what new failure modes it creates, and what teams can do to adapt without losing quality or accountability."}, {"slot": "5", "time": "2:45 PM ET", "room": "Sterling", "title": "The Elephants Among Us: Talking about the Hard Stuff at Work (and Beyond)", "speaker": "Nicole Derr", "track": "Agile Methodologies", "level": "General", "abstract": "Why is it getting increasingly hard to simply talk to one another? Heck, it’s gotten so bad that even the weather is not a safe topic of conversation. How can we ever expect to solve real problems in our organizations and improve outcomes for ourselves and our customers if we can’t talk about the elephants in the room?\r\n\r\nIn this lively session, we'll explore the importance of talking through difficult topics, why it’s so hard to do so, and what we can do to make it easier. Perhaps most importantly, we’ll practice discussing controversial topics with people who disagree with us, and help each other find the courage to face such topics head on."}, {"slot": "5", "time": "2:45 PM ET", "room": "Savannah", "title": "The Mark of a Professional", "speaker": "Ken Baum", "track": "Other", "level": "General", "abstract": "The Mark of a Professional makes the case that professionalism is more than competence, credentials, or career success. Rooted in the long tradition of apprenticeship, this talk argues that the true mark of a professional is the willingness to pass on hard-won knowledge to those coming behind. Attendees will rethink mentoring not as a formal program or personality trait, but as a practical responsibility embedded in everyday work. Along the way, they’ll gain a fresh understanding of stewardship, why mentoring strengthens both people and professions, and simple ways to begin investing in others immediately without needing extra time or bureaucracy."}, {"slot": "5", "time": "2:45 PM ET", "room": "Charleston", "title": "Agile in the Funhouse Mirror", "speaker": "Sam O'Brien", "track": "Agile Methodologies", "level": "General", "abstract": "You have learned, practiced, been certified and even trained others in Agile. You have incorporated the Values and Principles of the Manifesto into your mindset and feel confident in your Agile knowledge.\r\nSo, what happens when you find yourself in a new environment where you don’t recognize the Agile reflection in the mirror? We will discover ways of finding a path through Agile in name only set ups, unifying  theory and reality without shattering your looking glass."}, {"slot": "6", "time": "4:00 PM ET", "room": "Magnolia", "title": "The Adaptive Organization: A Leadership Guide to the System That Builds Business Agility", "speaker": "Brian Link", "track": "Scaling/Transformational Agile", "level": "Advanced", "abstract": "Every transformation I have led has failed to deliver the desired outcomes for the same reason: leaders fixed one layer of the system and neglected the others. Most organizations stand up agile teams and hope the agility spreads upward. They change the ceremonies without changing the system. Two years later, nothing feels fundamentally different.\r\n\r\nBusiness Agility — where the entire organization becomes adaptive, not just the technology division — requires five interdependent layers to work together. This session introduces a new operating model built from thirty of the industry's most important thinkers, organized into the five layers that every transformation leader needs to see:\r\n\r\n1.  Strategy & Outcomes  —  Are we clear about what problems we’re solving and how we’ll know we’ve solved them? Rumelt, Martin, and Gothelf on what real strategic clarity looks like and why most organizations confuse initiative portfolios with strategy.\r\n\r\n2.  Product Thinking & Discovery  —  Are we solving the right problems in the right ways? Perri, Cagan, and Torres on why organizations keep building the wrong things, and what it takes to give teams real authority over real customer problems.\r\n\r\n3.  Flow of Work  —  How fast can we turn learning into customer value? Reinertsen, Forsgren, Kim, and Kersten on the economics of slow delivery and the measurable practices that separate elite performers from everyone else.\r\n\r\n4.  Team & Organizational Design  —  Is our organization structured to enable flow and learning? Skelton, Galbraith, and Conway on why org structure is a product architecture decision — and what happens when you make it by accident.\r\n\r\n5.  Leadership & Culture  —  Are leaders creating the conditions for ownership and learning to thrive? Marquet, Edmondson, and Senge on why the most common bottleneck in any transformation is the leader, and what the shift from authority to intent actually requires.\r\n\r\nAttendees will recognize the dysfunctions in their own organization and understand where to begin. Clear takeaways and exercises for each of the five layers provide practical guidance — grounded in decades of practitioner experience and the industry's most important expert voices on strategy, product, flow, design, and culture."}, {"slot": "6", "time": "4:00 PM ET", "room": "Augusta", "title": "Storm Chaser -  a Journey of a scrum master as Agile Transformer", "speaker": "Somi Sengupta", "track": "Scaling/Transformational Agile", "level": "Intermediate", "abstract": "Is transforming a team as a Scrum Master starting to feel like chasing a tornado? This session is for you.\r\n\r\nWe’ll explore the toughest challenges Scrum Masters face when joining a new team—resistance to change, unclear roles, fear of losing control—and share proven techniques to overcome them.\r\n\r\nThrough real-world examples, you'll learn how to lead a struggling software development team working across time zones, multiple vendors, and a SaaS model, toward delivering high-quality code under tight deadlines.\r\n\r\nDiscover how to:\r\nChoose the right agile framework for your team\r\nReinforce the Scrum Master’s role as a servant leader\r\nBuild trust and empower your team\r\nNavigate the storming phase with practical tools and strategies\r\nJoin us to learn how to become a true catalyst for agile transformation."}, {"slot": "6", "time": "4:00 PM ET", "room": "Marquis", "title": "Using Copilot Squad to Amplify Your Work", "speaker": "Phil Japikse", "track": "AI", "level": "Intermediate", "abstract": "What if you had a team of agents available at your beck and call to help you with your work? That's exactly what Squad is. In this session, I'll show you how you can use Squad as a directed team of assitants to move the ball forward at a much faster pace then if you were working on your own."}, {"slot": "6", "time": "4:00 PM ET", "room": "Sterling", "title": "Behind the Blocks: 5 Years of Backend Engineering on the Minecraft Marketplace", "speaker": "Rick Payne", "track": "Architecture", "level": "General", "abstract": "For over five years, I served as a senior backend engineer on the Minecraft Marketplace, an in-game storefront reaching 200 million monthly active users. This talk covers the engineering practices behind that scale: our agile workflow, our Azure-based architecture, our use of CQRS and the mediator pattern, and how we structured our monorepo. I’ll share war stories from some of our gnarliest production bugs, plus the often-overlooked practices — logging, observability, and staying proactive during on-call shifts. I’ll also touch on how we adopted AI tooling like Copilot CLI into our workflow."}, {"slot": "6", "time": "4:00 PM ET", "room": "Savannah", "title": "You've Probably Never Heard of the Reticulum Network", "speaker": "Guy Royse", "track": "Security", "level": "Introduction", "abstract": "The networks we use every day depend on centralized infrastructure that's vulnerable to censorship, surveillance, and single points of failure. Whether it's disasters, deliberate interference, or plain old downtime, entire populations can, in an instant, be cut off from digital communication—sometimes when they need it most. The heart of the problem is hierarchy—the hierarchical structure of these networks makes them easy to exploit or to simply shut down.\r\n\r\nReticulum is one solution to this problem. It's a cryptography-based networking stack that flattens the hierarchy entirely. It was built for creating resilient, ad hoc, and private networks using almost any communication hardware you can imagine—from LoRa, WiFi, and Ethernet to old school packet radio and serial ports. Whether you're dealing with natural disasters or just want communications that can't be easily disrupted, Reticulum is a powerful tool for building independent, interconnectable networks that work without central points of control.\r\n\r\nThis talk will break down what Reticulum is and dig into how the protocol works—from its clever addressing tricks to its baked-in encryption. We'll explore the built-in utilities that ship with Reticulum; try out apps like MeshChat, NomadNet, and Sideband for communication; and even show some code and learn how to build apps of our own.\r\n\r\nBy the end, you'll understand how Reticulum and the applications that run on it work and how to set it all up for yourself. Plus, you'll have the knowledge to grow the network and its capabilities by writing with applications of your own. But most importantly, you'll walk away understanding how to build communication networks that can survive disasters, resist interference, and keep working when traditional infrastructure fails."}];
const SLOTLABELS = {"Welcome": "8:15 AM · Welcome", "1": "8:45 AM · Session 1", "2": "10:00 AM · Session 2", "3": "11:15 AM · Session 3", "Lunch": "12:30 PM · Lunch Sessions", "4": "1:30 PM · Session 4", "5": "2:45 PM · Session 5", "6": "4:00 PM · Session 6"};
const ROOM_ORDER = ["Magnolia", "Augusta", "Marquis", "Sterling", "Savannah", "Charleston"];
const ORDER = ["Welcome","1","2","3","Lunch","4","5","6"];
const list=document.getElementById('list'), tracksEl=document.getElementById('tracks'), roomsEl=document.getElementById('rooms'), overlay=document.getElementById('overlay');
let activeTrack=null, activeRoom=null;
const TRACKS=[...new Set(SESSIONS.map(s=>s.track).filter(Boolean))].sort();
const ROOMS=ROOM_ORDER.filter(r=>SESSIONS.some(s=>s.room===r));
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function buildTracks(){tracksEl.innerHTML='';TRACKS.forEach(t=>{const b=document.createElement('button');b.className='tk'+(activeTrack===t?' active':'');b.textContent=t+' — '+SESSIONS.filter(s=>s.track===t).length;b.onclick=()=>{activeTrack=(activeTrack===t)?null:t;buildTracks();render();};tracksEl.appendChild(b);});}
function buildRooms(){roomsEl.innerHTML='';ROOMS.forEach(r=>{const b=document.createElement('button');b.className='tk room'+(activeRoom===r?' active':'');b.textContent=r+' — '+SESSIONS.filter(s=>s.room===r).length;b.onclick=()=>{activeRoom=(activeRoom===r)?null:r;buildRooms();render();};roomsEl.appendChild(b);});}
function openModal(s){document.getElementById('m-title').textContent=s.title;const lvl=s.level?'<span class="chip">'+esc(s.level)+'</span>':'';const trk=s.track?'<span class="chip">'+esc(s.track)+'</span>':'';document.getElementById('m-meta').innerHTML='<span class="chip">📍 <b>'+esc(s.room)+'</b></span><span class="chip">🕑 '+esc(s.time)+'</span>'+(s.speaker?'<span class="chip">🎤 '+esc(s.speaker)+'</span>':'')+trk+lvl;document.getElementById('m-abx').textContent=s.abstract;overlay.classList.add('show');}
function closeModal(){overlay.classList.remove('show');}
document.getElementById('close').onclick=closeModal;overlay.onclick=e=>{if(e.target===overlay)closeModal();};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function render(){list.innerHTML='';for(const slot of ORDER){const items=SESSIONS.filter(s=>s.slot===slot);if(!items.length) continue;const h=document.createElement('div');h.className='slot';h.textContent=SLOTLABELS[slot];list.appendChild(h);const grid=document.createElement('div');grid.className='grid';for(const s of items){const dim=(activeTrack&&s.track!==activeTrack)||(activeRoom&&s.room!==activeRoom);const c=document.createElement('button');c.className='cell'+(dim?' dim':'');c.innerHTML='<div class="t">'+esc(s.title)+'</div><div class="b"><span class="sp">'+esc(s.speaker)+'</span><span class="rm">'+esc(s.room)+'</span></div>';if(!dim) c.onclick=()=>openModal(s);grid.appendChild(c);}list.appendChild(grid);}}
buildTracks();buildRooms();render();
</script>
